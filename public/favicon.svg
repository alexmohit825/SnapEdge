<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Porcelain White Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- International Safety Orange to Solar Flame -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D1A"/>
      <stop offset="100%" stop-color="#E03E00"/>
    </linearGradient>

    <!-- Alpine Racing Green -->
    <linearGradient id="racingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Precise Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square (Porcelain) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Yardline Matrix Elements (Swiss Precision Grid) -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="160" y1="160" x2="352" y2="160" stroke="#F1F5F9" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="160" y1="352" x2="352" y2="352" stroke="#F1F5F9" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Geometric Football / Quantum Vector Geometry in International Orange & Midnight Slate -->
  <g transform="rotate(-32 256 256)">
    <!-- Football Outer Silhouette -->
    <path d="M 128 256 C 128 150, 210 96, 256 96 C 302 96, 384 150, 384 256 C 384 362, 302 416, 256 416 C 210 416, 128 362, 128 256 Z" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="14" />

    <!-- Sharp Dynamic 'Snap' Lightning Bolt in International Orange -->
    <polygon points="270,135 216,246 266,246 232,372 316,230 262,230" 
             fill="url(#orangeGrad)" />

    <!-- Precision Yard Marker Ticks (Racing Green) -->
    <line x1="195" y1="210" x2="195" y2="290" stroke="url(#racingGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="317" y1="210" x2="317" y2="290" stroke="url(#racingGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>