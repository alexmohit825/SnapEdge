<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Energy Glow Gradient (Cyber Azure to Electric Emerald) -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Subtle Metallic Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334460"/>
      <stop offset="100%" stop-color="#151E2E"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Yardline Matrix Elements (Subtle Grid) -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#222F46" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>
  <line x1="160" y1="160" x2="352" y2="160" stroke="#151E2E" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <line x1="160" y1="352" x2="352" y2="352" stroke="#151E2E" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="140" fill="#00F5A0" opacity="0.12" filter="url(#glow)"/>

  <!-- Geometric Football / Quantum Vector Geometry -->
  <g transform="rotate(-32 256 256)">
    <!-- Football Outer Silhouette -->
    <path d="M 128 256 C 128 150, 210 96, 256 96 C 302 96, 384 150, 384 256 C 384 362, 302 416, 256 416 C 210 416, 128 362, 128 256 Z" 
          fill="none" 
          stroke="url(#edgeGlow)" 
          stroke-width="14" 
          filter="url(#glow)"/>

    <!-- Sharp Dynamic 'Snap' Lightning Bolt Intersecting -->
    <polygon points="270,140 220,246 266,246 236,366 312,234 262,234" 
             fill="url(#edgeGlow)" 
             filter="url(#glow)"/>

    <!-- Precision Yard Marker Ticks -->
    <line x1="200" y1="210" x2="200" y2="290" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="312" y1="210" x2="312" y2="290" stroke="#00F5A0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>